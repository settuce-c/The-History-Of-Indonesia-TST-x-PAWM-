# Gateway Nginx: satu-satunya pintu masuk ke core-service.
# Alur: Cloudflare Tunnel (cloudflared) -> gateway:80 -> core-service:3000

worker_processes 1;
events { worker_connections 512; }

http {
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;
  client_max_body_size 1m;

  # Semua request dari internet datang lewat container cloudflared, sehingga $remote_addr
  # selalu IP container tunnel. IP asli pengguna ada di header CF-Connecting-IP,
  # jadi itulah yang dipakai sebagai kunci rate limit (fallback ke $remote_addr saat uji lokal).
  map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
  }

  # Rate limit: umum 10 req/detik per IP; auth 5 req/menit per IP (anti brute-force login).
  limit_req_zone $client_ip zone=api_limit:10m  rate=10r/s;
  limit_req_zone $client_ip zone=auth_limit:10m rate=5r/m;
  limit_req_status 429;
  limit_conn_zone $client_ip zone=conn_limit:10m;

  log_format main '$client_ip - [$time_local] "$request" $status $body_bytes_sent ${request_time}s';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  upstream core_service {
    server core-service:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    limit_conn conn_limit 20;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Format error 429 & 502 seragam dengan core-service.
    error_page 429 = @rate_limited;
    error_page 502 503 504 = @unavailable;

    location /api/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://core_service;
    }

    location /api/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://core_service;
    }

    location = / {
      return 302 /api/docs/;
    }

    location / {
      default_type application/json;
      return 404 '{"error":{"code":"NOT_FOUND","message":"Gunakan prefix /api"}}';
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 60 always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Terlalu banyak request, coba lagi nanti"}}';
    }

    location @unavailable {
      default_type application/json;
      return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message":"core-service sedang tidak tersedia"}}';
    }
  }
}
